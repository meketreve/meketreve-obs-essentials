<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meketreve · Eventos</title>
  <link rel="stylesheet" href="/static/editor.css" />
  <link rel="stylesheet" href="/static/chat-render.css" />
  <link rel="stylesheet" href="/static/events-render.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">M</span><span data-i18n="Title">Eventos na tela</span></div>
    <div class="save" id="saveState"></div>
  </header>

  <div class="error" id="fatal" hidden></div>

  <div class="layout two" id="app" hidden>
    <main class="form" id="form"></main>
    <aside class="preview">
      <div class="events-frame" id="frame"><div id="pscale"><div id="plist"></div><div id="plabels"></div></div></div>
      <div class="preview-actions">
        <button class="btn" id="liveBtn" data-i18n="TestLive">Testar na live</button>
      </div>
      <p class="hint" id="liveHint" data-i18n="PreviewHint"></p>
    </aside>
  </div>

  <script src="/static/chat-render.js"></script>
  <script src="/static/events-render.js"></script>
  <script src="/static/events-editor.js"></script>
</body>
</html>
