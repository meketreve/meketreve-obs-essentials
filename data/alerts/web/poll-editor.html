<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meketreve · Enquete</title>
  <link rel="stylesheet" href="/static/editor.css" />
  <link rel="stylesheet" href="/static/poll-render.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">M</span><span data-i18n="Title">Enquete</span></div>
    <div class="save" id="saveState"></div>
  </header>

  <div class="error" id="fatal" hidden></div>

  <div class="layout two" id="app" hidden>
    <main class="form" id="form"></main>
    <aside class="preview">
      <div class="events-frame" id="frame"><div id="pscale"><div id="ppoll"></div></div></div>
      <div class="preview-actions">
        <button class="btn" id="stopBtn" data-i18n="Stop">Encerrar</button>
        <button class="btn" id="clearBtn" data-i18n="Clear">Tirar da tela</button>
      </div>
      <p class="hint" id="previewHint"></p>
    </aside>
  </div>

  <script src="/static/chat-render.js"></script>
  <script src="/static/poll-render.js"></script>
  <script src="/static/poll-editor.js"></script>
</body>
</html>
