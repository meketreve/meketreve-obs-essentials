name: Site
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/presets/**'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    name: Build site 🌐
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        run: python3 site/generate.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    name: Deploy to GitHub Pages 🚀
    # Pages has to be switched on once in the repository settings (source:
    # GitHub Actions); set the repository variable PAGES_ENABLED=true then.
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
